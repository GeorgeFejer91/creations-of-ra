<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><meta name="theme-color" content="#000">
  <title>Presentations — Ra.</title>
  <meta name="description" content="Beyond the Line — Rabia Saleemi, Manchester Museum Partition Project.">
  <link rel="canonical" href="https://creations-of-ra.com/presentations/"><link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css?v=control8"><link rel="stylesheet" href="/presentations/player.css?v=panels9">
  <script type="module" src="/presentations/landing.js?v=panels9"></script>
</head>
<body class="presentation-page">
<main id="presentation-app" data-layout="paired-panels">
  <section id="idle" class="presentation-idle">
    <header class="presentation-header"><a class="presentation-home" href="/" aria-label="Ra home">Ra.</a></header>
    <div class="presentation-card">
      <figure class="presentation-preview" aria-labelledby="presentation-title" aria-busy="true">
        <img id="cover" alt="Beyond the Line, original first slide" decoding="async" hidden>
        <figcaption id="cover-status" class="preview-status" role="status">Loading presentation…</figcaption>
      </figure>
      <aside class="controller-qr" aria-label="Presentation details and phone connection">
        <div class="presentation-heading">
          <h1 id="presentation-title" data-fit data-fit-min="28" data-fit-max="44" data-fit-line="1.03"><span>Beyond
the Line</span></h1>
          <p class="presentation-byline" data-fit data-fit-min="13" data-fit-max="14" data-fit-line="1.2" data-fit-single><span>Rabia Saleemi</span></p>
          <p class="presentation-project" data-fit data-fit-min="12" data-fit-max="13" data-fit-line="1.3"><span>Manchester Museum
Partition Project</span></p>
          <p class="presentation-meta" data-fit data-fit-min="12" data-fit-max="12" data-fit-line="1.2" data-fit-single><span>16 slides · 3 films</span></p>
        </div>
        <div class="panel-rule" aria-hidden="true"></div>
        <div class="controller-connect">
          <a id="controller-qr" class="qr" href="/presentations/controller/" aria-label="Scan or open the smartphone controller"></a>
          <div class="controller-label">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6.5" y="2" width="11" height="20" rx="2"/><path d="M10 5h4M10 19h4"/></svg>
            <span class="controller-label-text" data-fit data-fit-min="13" data-fit-max="14" data-fit-line="1.3" data-fit-single><span>Scan to control</span></span>
          </div>
          <p class="controller-note" data-fit data-fit-min="12" data-fit-max="12" data-fit-line="1.3" data-fit-single><span>One phone controls the presentation.</span></p>
        </div>
      </aside>
    </div>
  </section>
  <section id="live" class="presentation-live" hidden aria-label="Live presentation">
    <div id="viewer-stage" class="stage"></div>
    <div id="viewer-blackout" class="black-screen" hidden></div>
  </section>
  <p id="presentation-status" class="sr-only" role="status">Waiting for controller.</p>
</main>
</body>
</html>
